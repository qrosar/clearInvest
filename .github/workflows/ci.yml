name: CI

on:
  # Every branch, not just main: a feature branch pushed without a PR would
  # otherwise get no checks at all, which is exactly when they're most useful.
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so an obvious break fails fast.
      - name: Locale parity
        run: pnpm check:locales

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
